allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

buildscript {
    repositories {
        google()  // ✅ Required for Firebase and Play Services
        mavenCentral() // ✅ Ensures all necessary dependencies are available
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'  // ✅ Check latest version
        classpath 'com.google.gms:google-services:4.4.2'  // ✅ Ensure correct version
    }
}

